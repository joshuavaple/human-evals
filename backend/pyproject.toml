[project]
name = "human-evals-backend"
version = "0.1.0"
description = "API for human review of MLflow traces"
requires-python = ">=3.12"
dependencies = [
    "databricks-sdk>=0.141.0",
    "fastapi>=0.141.1",
    "mlflow>=3.1",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a live Databricks workspace (pass --profile and --experiment)",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
